            if (state.subject === 'custom') {
                const words = state.customWordsInput
                    .split(/[\n,]+/)
                    .map(w => w.trim().replace(/\s+/g, ''))
                    .filter(w => w.length > 0);
                if (words.length > 0) {
                    return words.map(w => ({ word: w, desc: '선생님이 입력하신 비밀 단어입니다.' }));
                }
                return [{ word: '세종대왕', desc: '선생님 입력이 없어 기본 단어로 세팅되었습니다.' }];
            }
            const group = WORD_POOLS[state.gradeGroup] || WORD_POOLS['5-6'];
            return group[state.subject] || group['social'];
        }

        function startGame() {
            if (state.players.length !== state.numPlayers) {
                state.players = Array.from({ length: state.numPlayers }, (_, i) => state.players[i] || `학생 ${i + 1}`);
            }

            state.scores = {};
            state.players.forEach((_, idx) => {
                state.scores[idx] = 0;
            });

            state.currentRound = 1;
            state.totalRounds = 4; // 무조건 4라운드 고정
            state.usedWords = []; // 게임 시작 시 중복 단어 기록 초기화

            initRound();
        }

        function initRound() {
            const pool = getWordPool();
            
            // 아직 사용되지 않은 단어 우선 선발 (중복 방지)
            let availableWords = pool.filter(item => !state.usedWords.includes(item.word));
            if (availableWords.length === 0) {
                // 단어를 모두 사용한 경우 리셋
                state.usedWords = [];
                availableWords = pool;
            }

            const chosen = availableWords[Math.floor(Math.random() * availableWords.length)];
            state.secretWordObj = chosen;
            state.usedWords.push(chosen.word);

            // Fisher-Yates 무작위 셔플로 완벽한 랜덤 스파이 지정
            const indices = Array.from({ length: state.numPlayers }, (_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            state.spies = indices.slice(0, 2);

            state.activePlayerIdx = 0;
            state.startPlayerIdx = (state.currentRound - 1) % state.numPlayers;
            state.votes = {};

            state.step = 'ROLE_CHECK';
            render();
        }

        const $main = document.getElementById('main-content');

        function render() {
            switch (state.step) {
                case 'SETUP':
                    renderSetup();
                    break;
                case 'ROLE_CHECK':
                    renderRoleCheck();
                    break;
                case 'CLUE_GUIDE':
                    renderClueGuide();
                    break;
                case 'VOTING':

        function goToVoting() {

        function renderVoting() {
            const voterIdx = state.activePlayerIdx;
            const voterName = state.players[voterIdx];
            const currentVotes = state.votes[voterIdx] || [];

            $main.innerHTML = `
                <div class="glass-panel p-5 rounded-3xl shadow-xl space-y-4 border border-white animate-fadeIn">
                    <div class="bg-amber-500 text-slate-900 p-3 rounded-2xl flex items-center justify-between font-bold text-xs shadow-sm">
                        <span>🕵️ 스파이 투표 (차례: ${voterIdx + 1}/${state.numPlayers})</span>
                        <span class="bg-slate-900 text-white px-2 py-0.5 rounded-full">${voterName} 님의 지목</span>

                    <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-2xl text-xs text-indigo-900 space-y-1">

                        </p>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        ${state.players.map((name, idx) => {
                            const isSelected = currentVotes.includes(idx);
                            const isSelf = idx === voterIdx;
                            return `
                                <button type="button" onclick="toggleVote(${voterIdx}, ${idx})"
                                    class="p-2.5 rounded-2xl text-xs font-bold transition-all text-left flex items-center justify-between border ${isSelected ? 'bg-indigo-600 text-white border-indigo-600 shadow-md scale-[1.02]' : 'bg-white text-slate-800 border-slate-200 hover:bg-slate-50'}">
                                    <span>${idx + 1}. ${name} ${isSelf ? '(본인)' : ''}</span>
                                    ${isSelected ? '<i class="fa-solid fa-check-circle text-amber-300"></i>' : ''}
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <button type="button" onclick="nextVoter()" 
                        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xs rounded-2xl shadow-md transition-transform active:scale-95 font-display">

            `;
        }

        function toggleVote(voterIdx, targetIdx) {
            if (!state.votes[voterIdx]) state.votes[voterIdx] = [];
            const list = state.votes[voterIdx];
            const pos = list.indexOf(targetIdx);
            if (pos > -1) {
                list.splice(pos, 1);
            } else {
                if (list.length >= 2) {
                    list.shift(); // 2개 유지
                }
                list.push(targetIdx);
            }
            renderVoting();
        }

        function nextVoter() {
            const voterIdx = state.activePlayerIdx;
            if (!state.votes[voterIdx] || state.votes[voterIdx].length < 2) {
                showToastModal("스파이 2명을 모두 지목해 주세요!");
                return;
            }

            state.activePlayerIdx++;
            if (state.activePlayerIdx < state.numPlayers) {
                renderVoting();
            } else {
                calculateScoresAndProceed();
            }
        }

        function calculateScoresAndProceed() {
            state.lastRoundDetails = [];
            const [spy1, spy2] = state.spies;

            state.players.forEach((name, idx) => {
                const isSpy = state.spies.includes(idx);
                const myVotes = state.votes[idx] || [];
                let roundScore = 0;
                const reasons = [];

                if (isSpy) {
                    // 1. 스파이 규칙: 나와 상대 스파이를 모두 지목해야 +3점, 아니면 +0점
                    const partnerSpyIdx = idx === spy1 ? spy2 : spy1;
                    const pickedSelf = myVotes.includes(idx);
                    const pickedPartner = myVotes.includes(partnerSpyIdx);

                    if (pickedSelf && pickedPartner) {
                        roundScore += 3;
                        reasons.push("나와 상대 스파이 지목 성공 (+3점)");
                    } else {
                        reasons.push("나 또는 상대 스파이 지목 실패 (+0점)");
                    }
                } else {
                    // 2. 더블 에이전트 규칙: 두 스파이 모두 찾으면 +2점
                    const pickedBothSpies = myVotes.includes(spy1) && myVotes.includes(spy2);
                    if (pickedBothSpies) {
                        roundScore += 2;
                        reasons.push("두 스파이 모두 지목 성공 (+2점)");
                    }

                    // 3. 더블 에이전트 규칙: 나를 제외한 타인이 한 명이라도 나를 지목하면 +1점
                    const votedByOthers = state.players.some((_, voterIdx) => {
                        if (voterIdx === idx) return false;
                        return (state.votes[voterIdx] || []).includes(idx);
                    });

                    if (votedByOthers) {
                        roundScore += 1;
                        reasons.push("타인에게 스파이로 지목당함 (+1점)");
                    }

                    if (!pickedBothSpies && !votedByOthers) {
                        reasons.push("득점 조건 미충족 (+0점)");
                    }
                }

                state.scores[idx] = (state.scores[idx] || 0) + roundScore;

                state.lastRoundDetails.push({
                    playerIdx: idx,
                    name: name,
                    isSpy: isSpy,
                    roundScore: roundScore,
                    reasons: reasons,
                    totalScore: state.scores[idx]
                });
            });

            state.step = 'ROUND_RESULT';
            render();
        }

            $main.innerHTML = `

                            <span class="text-[10px] text-slate-400">(해당 라운드 / 누적 점수)</span>
                        </h3>

                        <div class="space-y-2 max-h-[35vh] overflow-y-auto pr-1">

                                <div class="bg-white/90 p-3 rounded-2xl border border-slate-200 text-xs shadow-sm space-y-1">
                                    <div class="flex items-center justify-between font-bold">
                                        <span class="flex items-center gap-1">
                                            ${item.isSpy ? '🕵️ <span class="text-red-600">[스파이]</span>' : '🕵️‍♂️ <span class="text-blue-600">[더블에이전트]</span>'}
                                            ${item.name}
                                        </span>
                                        <span class="text-indigo-700 font-black">
                                            +${item.roundScore}점 <span class="text-slate-400 font-normal">(총 ${item.totalScore}점)</span>
                                        </span>
                                    </div>
                                    <div class="text-[11px] text-slate-600 bg-slate-50 p-2 rounded-xl border border-slate-100 space-y-0.5">
                                        ${item.reasons.length > 0 
                                            ? item.reasons.map(r => `<div>• ${r}</div>`).join('')
                                            : `<div>• 득점 없음 (0점)</div>`
                                        }
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button type="button" onclick="nextRoundStep()" 
                        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm rounded-2xl shadow-lg transition-transform active:scale-95 font-display flex items-center justify-center gap-2">
                        ${state.currentRound < state.totalRounds ? `다음 라운드 진행하기 (${state.currentRound + 1}/${state.totalRounds}) ➡️` : '최종 게임 결과 보기 🏆'}
                    </button>
                </div>
            `;
        }

        function nextRoundStep() {
            if (state.currentRound < state.totalRounds) {
                state.currentRound++;
                initRound();
            } else {
                state.step = 'GAME_OVER';
                render();
            }
        }

        function renderGameOver() {
            const leaderboard = state.players.map((name, idx) => ({
                name,
                idx,
                score: state.scores[idx] || 0
            })).sort((a, b) => b.score - a.score);

            const winner = leaderboard[0];

            $main.innerHTML = `
                <div class="glass-panel p-6 rounded-3xl shadow-xl text-center space-y-5 border border-white animate-fadeIn">
                    <div class="space-y-1">
                        <div class="inline-block px-4 py-1 bg-red-100 text-red-600 rounded-full font-black text-xs">
                            🎮 게임 종료!
                        </div>
                        <h2 class="text-2xl font-black text-slate-800 font-display">
                            🎉 승리! 최고의 추리왕
                        </h2>
                        <p class="text-xs text-slate-500">총 4라운드가 끝났습니다. 축하합니다!</p>
                    </div>

                    <div class="bg-gradient-to-b from-amber-400 to-amber-500 text-slate-900 p-4 rounded-2xl shadow-lg font-display">
                        <i class="fa-solid fa-trophy text-4xl text-amber-100 mb-1 animate-bounce-short"></i>
                        <div class="text-xs font-bold text-amber-900">최종 1위 우승자</div>
                        <div class="text-2xl font-black">${winner.name}</div>
                        <div class="text-sm font-black mt-1 bg-white/30 inline-block px-3 py-0.5 rounded-full">
                            총 ${winner.score}점 획득
                        </div>
                    </div>

                    <div>
                        <h3 class="text-xs font-bold text-slate-600 mb-2 text-left">🏆 누적 명예의 전당</h3>
                        <div class="space-y-1.5 max-h-[30vh] overflow-y-auto pr-1">
                            ${leaderboard.map((item, rank) => `
                                <div class="bg-white/80 p-2.5 rounded-xl border border-slate-200 text-xs flex items-center justify-between font-bold">
                                    <span class="flex items-center gap-2">
                                        <span class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] ${rank === 0 ? 'bg-amber-400 text-slate-900' : rank === 1 ? 'bg-slate-300 text-slate-800' : rank === 2 ? 'bg-amber-700 text-white' : 'bg-slate-100 text-slate-500'}">
                                            ${rank + 1}
                                        </span>
                                        ${item.name}
                                    </span>
                                    <span class="text-indigo-600">${item.score}점</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-slate-100 p-3 rounded-2xl text-xs text-slate-600 font-medium">
                        👏 모두 훌륭한 교과 추리력을 보여주었습니다!
                    </div>

                    <button type="button" onclick="resetToSetup()" 
                        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-sm rounded-2xl shadow-lg font-display flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> 새 게임 설정으로 이동
                    </button>
                </div>
            `;
        }

        function resetToSetup() {
            state.step = 'SETUP';
            render();
        }

        window.onload = function() {
            setNumPlayers(4);
            render();
        };
    </script>
</body>
</html>
